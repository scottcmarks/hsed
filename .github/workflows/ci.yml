name: ci

on:
  push:
  pull_request:

jobs:
  # Every Haskell test suite of the three packages on the resolver's exact GHC; stack never
  # downloads a compiler.
  stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.7'
          enable-stack: true
          stack-version: 'latest'
      # The GHC 9.4.7 Linux bindist hard-wires -fuse-ld=gold into its settings, and the gold
      # linker is gone from ubuntu-26.04's binutils ("collect2: fatal error: cannot find 'ld'");
      # let gcc pick the system linker instead.
      - if: runner.os == 'Linux'
        run: |
          settings="$(ghc --print-libdir)/settings"
          sudo sed -i 's/-fuse-ld=gold//g' "$settings"
          grep -c 'fuse-ld' "$settings" || true
      # On macos-26 the Command Line Tools' ld cannot read its own SDK's arm64e.x1 .tbd stubs
      # ("tapi error: malformed file ... unknown architecture"); the newest Xcode's ld can.
      - if: runner.os == 'macOS'
        run: |
          ls -d /Applications/Xcode*.app || true
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          ld -v 2>&1 | head -1
          xcrun --show-sdk-path
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            **/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', '**/package.yaml') }}
          restore-keys: stack-${{ runner.os }}-
      - run: stack --system-ghc --no-install-ghc test
      # The hsedc side of gate b (docs/spec-as-source.md sections 5.2, 5.4): annotate the pristine
      # Core PDF from the committed sidecar, extract the annotated PDF, then hsedc bind, check and
      # compile; the committed bindings module and hsed/gen must be exactly what it writes. Ubuntu
      # only (one runner is enough for a determinism gate). The chain renders nothing, so it needs
      # the venv but not Ghostscript (the extract job's pdf-checks do the rendering).
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: make venv
      - if: runner.os == 'Linux'
        run: make gen-diff

  # The committed IR extractions regenerate byte-for-byte (gate b), and the PDF side of the
  # annotation round trip holds (gates c-e, docs/spec-as-source.md section 5.4): the annotated
  # PDF is pristine + the committed .upd, renders identically under Ghostscript and MuPDF (sips is
  # macOS-only and skipped here), reads back the same through pikepdf, pypdf and pymupdf, and
  # dump(apply(upd)) == hsa, annotate(hsa) == upd.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - run: make venv
      - run: make extract-test
      - run: make regen-diff
      - run: make annotate
      - run: make pdf-checks
