name: ci

on:
  push:
  pull_request:

jobs:
  # Every Haskell test suite of the three packages on the resolver's exact GHC; stack never
  # downloads a compiler.
  stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.7'
          enable-stack: true
          stack-version: '3.11.1'   # the version used locally (docs/spec-as-source.md 10.1)
      # The GHC 9.4.7 Linux bindist hard-wires -fuse-ld=gold (in its settings and in the hsc2hs
      # wrapper's --lflag), and the gold linker is gone from ubuntu-26.04's binutils
      # ("collect2: fatal error: cannot find 'ld'"). Strip it everywhere in the install so gcc
      # picks the system linker.
      - if: runner.os == 'Linux'
        run: |
          root="$(cd "$(ghc --print-libdir)/../../.." && pwd)"
          echo "GHC install: $root"
          files="$(sudo grep -rlI -e '-fuse-ld=gold' "$root" || true)"
          echo "$files"
          [ -z "$files" ] || echo "$files" | xargs sudo sed -i 's/--lflag=-fuse-ld=gold//g; s/-fuse-ld=gold//g'
          ! sudo grep -rlI -e '-fuse-ld=gold' "$root"
      # The GHC 9.4.7 macOS bindist's rts links libffi from a hard-coded
      # /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk. On macos-26 that symlink names a
      # MacOSX27.0 SDK whose arm64e.x1 .tbd stubs no installed Xcode's ld can read ("tapi error:
      # malformed file ... unknown architecture"). Select the newest Xcode and point that path at
      # its own SDK, so the linker and the stubs come from the same toolchain.
      - if: runner.os == 'macOS'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          sdk="$(xcrun --show-sdk-path)"
          ls /Library/Developer/CommandLineTools/SDKs || true
          sudo ln -sfn "$sdk" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          xcode-select -p
          ld -v 2>&1 | head -1
          ls -l /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
      # A run restores the newest cache of its runner (restore-keys), and GHC does not compile a
      # module again for -Werror alone (docs/spec-as-source.md section 12): the v2 prefix started
      # from nothing once, after the first runs had cached objects compiled without it, so that
      # every object of the three packages (hsed-core, hsed-spec, hsed) the cache holds was
      # compiled with -Werror. The snapshot's packages it holds under ~/.stack were not, and need
      # not be: --ghc-options applies to the project's packages alone.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            **/.stack-work
          key: stack-v2-${{ runner.os }}-${{ hashFiles('stack.yaml', '**/package.yaml') }}
          restore-keys: stack-v2-${{ runner.os }}-
      # -Werror turns each package's own warnings (-Wall and the rest of its ghc-options) into
      # errors here only, so the house rule "-Wall clean" is enforced without blocking local work.
      - run: stack --system-ghc --no-install-ghc test --ghc-options=-Werror
      # The kext transport (design 7.2) compiled and linked on macOS, never run: the C shim over IOKit
      # and CoreFoundation and the flag-on half of Hsed.Transport.MacKext, which no other build compiles,
      # the flag being manual and off. In a work dir of its own, .stack-work-kext, which the cache above
      # does not hold, so that the cached .stack-work stays flag-off and the next run's tests do not
      # rebuild hsed (design 5.4 a); the snapshot's packages come from the cached ~/.stack.
      - if: runner.os == 'macOS'
        run: stack --system-ghc --no-install-ghc --work-dir .stack-work-kext build hsed --flag hsed:kext --ghc-options=-Werror
      # The hsedc side of gate b (docs/spec-as-source.md sections 5.2, 5.4): annotate the pristine
      # Core and Opal PDFs from the committed sidecars, extract the annotated PDFs, then hsedc bind,
      # check and compile each (Opal over Core's Context, its unbound units Warnings until M5); the
      # committed bindings modules, hsed/gen, docs/LEDGER.md and docs/LEDGER-opal.md must be exactly
      # what it writes (a module it no longer writes is removed, and the diff shows it). Ubuntu
      # only (one runner is enough for a determinism gate). The chain renders nothing, so it needs
      # the venv but not Ghostscript (the extract job's pdf-checks do the rendering).
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: make venv
      - if: runner.os == 'Linux'
        run: make gen-diff

  # The committed IR extractions regenerate byte-for-byte (gate b), and the PDF side of the
  # annotation round trip holds for each spec, Core and Opal (gates c-e, docs/spec-as-source.md
  # section 5.4): the annotated PDF is pristine + the committed .upd, renders identically under
  # Ghostscript and MuPDF (sips is macOS-only and skipped here), reads back the same through pikepdf,
  # pypdf and pymupdf, and dump(apply(upd)) == hsa, annotate(hsa) == upd.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - run: make venv
      - run: make extract-test
      - run: make regen-diff
      - run: make annotate
      - run: make pdf-checks
