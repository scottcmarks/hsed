name: ci

on:
  push:
  pull_request:

jobs:
  # Every Haskell test suite of the three packages on the resolver's exact GHC; stack never
  # downloads a compiler.
  stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.7'
          enable-stack: true
          stack-version: 'latest'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', '**/package.yaml') }}
          restore-keys: stack-${{ runner.os }}-
      - run: stack --system-ghc --no-install-ghc test

  # The committed table extractions regenerate byte-for-byte, and the M1 annotate ->
  # extract -> generate round trip holds (the Haskell typecheck of the generated module is
  # part of the stack job's library; here the PDF side and the generator are exercised).
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - run: make venv
      - run: make regen-diff
      - run: make m1
