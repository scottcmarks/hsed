name:                hsed
version:             0.1.0.1
github:              scottcmarks/hsed
license:             BSD3
author:              Scott Marks
maintainer:          scott@magnolia-heights.com
copyright:           Magnolia Heights R&D

# Metadata used when publishing your package
# synopsis:            TCG SWG Self-Encrypting Drive library
# category:            System

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on Github at <https://github.com/scottcmarks/hsed#readme>

# the C headers: the drive's CDBs' (cbits/hsed_cdb.h, every build) and the kext shim's (cbits/hsed_kext.h,
# under the kext flag, and in hsed-test against its stub IOKit); the stub's (spec-tests/cbits/stub)
extra-source-files:
- cbits/*.h
- spec-tests/cbits/stub/**/*.h

flags:
  # The macOS drive transport (Hsed.Transport.MacKext): the C shim cbits/hsed_kext.c over IOKit, which
  # issues design 9.3's five commands and nothing else (Level 0 Discovery's IF-RECV and, on the drive's
  # base ComID once bound, a ComPacket's IF-SEND and IF-RECV and STACK_RESET's pair), each CDB built by
  # cbits/hsed_cdb.c, which every build compiles (design 7.2, 9.3). Manual and off: CI's tests build
  # without it (hsed-test compiles the shim's own code against a stub IOKit and runs it, nothing of IOKit
  # linked), and one macOS step of CI compiles it, never running it; on with stack build hsed --flag
  # hsed:kext, built as yourself, never with sudo stack.
  kext:
    description: Build the kext transport's C shim (macOS only)
    manual: true
    default: false

dependencies:
- base >= 4.10 && < 10
- rio >= 0.1.1.0

ghc-options:
- -Wall
- -Wcompat
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wredundant-constraints
- -optP-Wno-nonportable-include-path # workaround [Filename case on macOS · Issue #4739 · haskell/cabal](https://github.com/haskell/cabal/issues/4739)

library:
  # gen/ holds the modules hsedc compile writes (Hsed.Gen.*; generated, committed)
  source-dirs:
  - src
  - gen
  # mirrored by hsed-doc-test's list below, which interprets these sources: a dependency added here is added there
  dependencies:
  - hsed-core
  - aeson              # the wire types' and the jig reports' JSON (M3)
  - base16-bytestring  # hex in transcripts, reports and the capture sidecar (M3)
  - bytestring         # Hsed.Gen.Core.Layouts (generated code imports Data.ByteString, not RIO)
  - containers         # Hsed.Gen.Core.TableUIDs (Data.Map)
  - cryptonite         # Hsed.Jig.Sha256: the capture's SHA-256 (M3 review; in the snapshot, as hsed-spec's)
  - directory          # Hsed.Jig.Files, the reports (M3)
  - filepath
  - githash            # GitHash.Extras.GitVersion: both executables' version, and Hsed.Version's (M3)
  - lens               # Hsed.App
  - memory             # Hsed.Jig.Sha256: cryptonite's digest as bytes (Data.ByteArray)
  - QuickCheck         # Hsed.Law's properties, Hsed.Sim.Gen's generators (M3)
  - template-haskell   # GitHash.Extras.GitVersion
  - text               # Hsed.Gen.Core.Tokens (generated code imports Data.Text, not RIO)
  - time               # the reports' UTC stamps (M3)
  # the CDBs of the five commands a drive transport carries (M4c): portable C99 compiled in every build, so
  # that the tests run it through FFI wherever CI builds; no -Werror for C (gcc and clang warn differently)
  c-sources:
  - cbits/hsed_cdb.c
  include-dirs:
  - cbits
  cc-options:
  - -Wall
  - -Wextra
  when:
  # Hsed.Jig.Files: files written under sudo handed to SUDO_UID/SUDO_GID; the euid 0 gate
  - condition: '!os(windows)'
    dependencies:
    - unix
  # the kext shim, and Hsed.Transport.MacKext's foreign imports of it (CPP HSED_KEXT)
  - condition: flag(kext) && os(darwin)
    c-sources:
    - cbits/hsed_kext.c
    frameworks:
    - IOKit
    - CoreFoundation
    cpp-options:
    - -DHSED_KEXT

executables:
  # the host test jig (design 9.2, M3): its command line; what each command does is Hsed.Jig.Cli
  hsed-jig:
    main:                Main.hs
    source-dirs:         app/hsed-jig
    dependencies:
    - hsed
    - optparse-applicative

    # -threaded: the kext's FFI call is a safe one, which blocks its own OS thread alone
    ghc-options:
    - -threaded
    - -rtsopts

  # the 2019 stub (logs a line through Hsed.TPer.Run), kept at M3 beside hsed-jig: design 13.27 (c)
  hsed:
    main:                Main.hs
    source-dirs:         app/hsed
    dependencies:
    - hsed
    - githash
    - optparse-simple
    - template-haskell

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

tests:
  hsed-test:
    main:                Spec.hs
    # fixture/Hand: the 2019 hand transcription the oracle compares (design 5.5, M2d)
    source-dirs:
    - spec-tests
    - fixture
    dependencies:
    - hsed
    - hsed-core
    - aeson              # the wire types' JSON (M3)
    - containers         # EquivSpec: the two sides by name; the fixture's TableUIDs and TH parsers
    - ghc-prim           # the fixture's quasiquotes (GHC.Classes, GHC.Types)
    - attoparsec         # the fixture's TH parsers (Hand.TypeUIDs.TH, Hand.TableUIDs.TH)
    - bytestring         # the same parsers' input (Data.ByteString)
    - directory          # EquivTH: every generated module of the spec; CapabilitySpec: every source module
    - filepath
    - hspec
    - QuickCheck         # PacketSpec: frames round trip
    - template-haskell   # EquivTH: every definition of either side, from source; CapabilitySpec: the signatures
    when:
    # FilesSpec: links, owners and groups, as Hsed.Jig.Files writes as root
    - condition: '!os(windows)'
      dependencies:
      - unix
    build-tools:
    - hspec-discover
    # The C the tests alone compile (the M4c review's verification): the kext shim, cbits/hsed_kext.c itself,
    # against a stub of what it calls of Mach, CoreFoundation and IOKit (spec-tests/cbits/stub, whose headers
    # stand in for the system's, every function the shim calls a macro for one named hsed_stub_*), its five
    # functions renamed hsed_stubbed_kext_* and its geteuid the stub's, so that the shim's own code runs with
    # nothing of IOKit linked and no call reaching a kext (Hsed.Transport.KextShimSpec); and a signal's action as
    # sigaction reads it (Hsed.Jig.RunSpec). Listed as itself, so that an edit of hsed_kext.c recompiles it here.
    c-sources:
    - cbits/hsed_kext.c
    - spec-tests/cbits/hsed_kext_stub.c
    - spec-tests/cbits/hsed_test_signals.c
    include-dirs:
    - spec-tests/cbits/stub
    cc-options:
    - -Wall
    - -Wextra
    - -Dhsed_kext_locate=hsed_stubbed_kext_locate
    - -Dhsed_kext_open=hsed_stubbed_kext_open
    - -Dhsed_kext_bind=hsed_stubbed_kext_bind
    - -Dhsed_kext_command=hsed_stubbed_kext_command
    - -Dhsed_kext_close=hsed_stubbed_kext_close
    - -Dgeteuid=hsed_stub_geteuid

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

  # doctest over every module under src that holds an example (a `-- >>>` line), listed when the suite
  # runs, as hsed-core's suite lists its modules (design 12). The suite interprets the library's sources
  # (src and gen on its path), so it needs the library's dependencies, listed here again: a dependency added to the
  # library above is added here too (its list says so).
  hsed-doc-test:
    main:                DocTest.hs
    source-dirs:         doc-tests
    dependencies:
    - hsed-core
    - aeson
    - base16-bytestring
    - bytestring
    - containers
    - cryptonite
    - directory
    - doctest
    - filepath
    - githash
    - lens
    - memory
    - QuickCheck
    - template-haskell
    - text
    - time
    when:
    - condition: '!os(windows)'
      dependencies:
      - unix

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
